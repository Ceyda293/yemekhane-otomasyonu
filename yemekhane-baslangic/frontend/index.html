<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Yemekhane Otomasyonu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="ust-bar">
        <div class="logo">🍽️ Yemekhane Otomasyonu</div>
        <div id="kullanici-bilgi" class="kullanici-bilgi gizli">
            <span id="ad-soyad"></span>
            <span class="bakiye-rozet">Bakiye: <strong id="bakiye-gosterge">0.00</strong> ₺</span>
            <button id="cikis-btn" class="btn-ikincil">Çıkış</button>
        </div>
    </header>

    <main class="kapsayici">
        <div id="bildirim" class="bildirim gizli"></div>

        <section id="giris-bolumu" class="kart giris-karti">
            <h2>Sisteme Giriş</h2>
            <form id="giris-formu">
                <label for="eposta">E-posta</label>
                <input type="email" id="eposta" placeholder="mehmet.yildiz@ogr.kampus.edu.tr" required>

                <label for="sifre">Şifre</label>
                <input type="password" id="sifre" placeholder="••••••••" required>

                <button type="submit" class="btn-birincil">Giriş Yap</button>
            </form>
        </section>

        <section id="ana-panel" class="gizli">
            <nav class="sekmeler">
                <button class="sekme aktif" data-sekme="menuler">Menüler</button>
                <button class="sekme" data-sekme="rezervasyonlar">Rezervasyonlarım</button>
                <button class="sekme" data-sekme="bakiye">Bakiye & Hareketler</button>
                <button class="sekme" data-sekme="profil">Profil & Alerjenler</button>
                <button id="yonetici-sekme-btn" class="sekme gizli" data-sekme="yonetici">Yönetici Paneli</button>
            </nav>

            <div id="sekme-menuler" class="sekme-icerik">
                <div class="filtre-bar">
                    <label for="tarih-sec">Tarih:</label>
                    <input type="date" id="tarih-sec">
                    <button id="menu-getir-btn" class="btn-birincil">Göster</button>
                    <button id="haftalik-btn" class="btn-ikincil">Bu Hafta (7 Gün)</button>
                </div>
                <div id="menu-listesi" class="menu-izgara"></div>
            </div>

            <div id="sekme-rezervasyonlar" class="sekme-icerik gizli">
                <div id="rezervasyon-listesi"></div>
            </div>

            <div id="sekme-bakiye" class="sekme-icerik gizli">
                <div class="kart">
                    <h3>Bakiye Yükle</h3>
                    <form id="bakiye-formu" class="satir-form">
                        <input type="number" id="yukleme-tutar" min="1" step="0.01" placeholder="Tutar (₺)" required>
                        <button type="submit" class="btn-birincil">Yükle</button>
                    </form>
                </div>
                <div class="kart">
                    <h3>Son Bakiye Hareketleri</h3>
                    <table class="tablo">
                        <thead>
                            <tr>
                                <th>Tarih</th>
                                <th>Tür</th>
                                <th>Tutar</th>
                                <th>Açıklama</th>
                            </tr>
                        </thead>
                        <tbody id="hareket-tablosu"></tbody>
                    </table>
                </div>
            </div>

            <div id="sekme-profil" class="sekme-icerik gizli">
                <div class="kart">
                    <h3>Alerjen Tercihlerim</h3>
                    <p class="menu-meta">Alerjiniz olan besinleri seçin. Menüde bu alerjenleri içeren yemekler uyarıyla gösterilecektir.</p>
                    <form id="alerjen-formu" class="yonetici-form">
                        <div id="alerjen-listesi" class="yemek-secim-izgara"></div>
                        <button type="submit" class="btn-birincil">Alerjenleri Kaydet</button>
                    </form>
                </div>
            </div>

            <div id="sekme-yonetici" class="sekme-icerik gizli">
                <div class="kart">
                    <h3>Yeni Yemek Ekle</h3>
                    <form id="yemek-ekle-formu" class="yonetici-form">
                        <select id="yemek-kategori" required></select>
                        <input type="text" id="yemek-ad" placeholder="Yemek adı" required>
                        <input type="number" id="yemek-kalori" min="0" placeholder="Kalori (kcal)" required>
                        <label class="onay-kutu">
                            <input type="checkbox" id="yemek-vejetaryen"> Vejetaryen
                        </label>
                        <button type="submit" class="btn-birincil">Yemek Ekle</button>
                    </form>
                </div>

                <div class="kart">
                    <h3>Yeni Menü Oluştur</h3>
                    <form id="menu-olustur-formu" class="yonetici-form">
                        <select id="menu-yemekhane" required></select>
                        <input type="date" id="menu-tarih" required>
                        <select id="menu-ogun" required></select>
                        <input type="number" id="menu-ogrenci-fiyat" step="0.01" min="0" placeholder="Öğrenci Fiyatı (₺)" required>
                        <input type="number" id="menu-personel-fiyat" step="0.01" min="0" placeholder="Personel Fiyatı (₺)" required>
                        <div class="yemek-secim-alani">
                            <strong>Menüdeki Yemekleri Seçin:</strong>
                            <div id="menu-yemek-listesi" class="yemek-secim-izgara"></div>
                        </div>
                        <button type="submit" class="btn-birincil">Menüyü Kaydet</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
